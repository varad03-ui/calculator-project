<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="calculator">

    <!-- NEW HEADING -->
    <h2 class="title">Calculator</h2>

    <!-- Display -->
    <input type="text" id="display">

    <!-- Toggle -->
    <button class="toggle" onclick="togglePanel()">☰</button>

    <!-- Buttons -->
    <div class="buttons">

        <button class="clear" onclick="clearScreen()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="add('(')">(</button>
        <button onclick="add(')')">)</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('-')">−</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="operator" onclick="add('+')">+</button>
        <button class="equals" onclick="calculate()">=</button>

    </div>

    <!-- Side Panel -->
    <div class="side-panel" id="panel">

        <button onclick="add('sin(')">sin</button>
        <button onclick="add('cos(')">cos</button>
        <button onclick="add('tan(')">tan</button>

        <button onclick="add('log(')">log</button>
        <button onclick="add('sqrt(')">√</button>
        <button onclick="add('**')">^</button>

        <button onclick="add('pi')">π</button>
        <button onclick="add('E')">e</button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
